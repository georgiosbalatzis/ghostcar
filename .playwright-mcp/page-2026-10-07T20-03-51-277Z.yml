                        - generic [ref=f1e43]: F1 STORIES.
                        - text: Άνοιγμα στο TYRES ↗
              - paragraph [ref=e106]:
                - text: Για την Aston Martin, όλο αυτό αποδείχτηκε μάλλον ευνοϊκό, και
                - link "ο Stroll το είπε" [ref=e107] [cursor=pointer]:
                  - /url: https://www.formula1.com/en/latest/article/what-the-teams-said-race-day-in-bahrain-2026.4kwHL7ygJLqVlSMHhAj6ce
                - text: "μετά τον αγώνα χωρίς πολλές τεχνικές διπλωματίες: η ομάδα περίμενε ότι η Μαλαισία θα της ταιριάξει καλύτερα, γιατί εκεί ο χρόνος του γύρου εξαρτάται λιγότερο από την ισχύ και το grip. Η AMR26 δεν μεταμορφώθηκε ξαφνικά σε αυτοκίνητο με τεράστιο downforce. Δύο αδυναμίες που την είχαν τιμωρήσει βαριά σε άλλα Grand Prix απλώς έπαψαν να μετράνε τόσο πολύ. Με περισσότερες στροφές ανάμεσα στις μεγάλες ευθείες, η έλλειψη ισχύος δεν εξαφανίστηκε, έπαψε όμως να κρίνει τόσο μεγάλο κομμάτι του γύρου. Για να φανεί καλύτερα, ας μην ξεκινήσουμε από το P8 της Κυριακής αλλά από την αρχή του Σαββατοκύριακου."
              - heading "Παρασκευή" [level=3] [ref=e108]
              - paragraph [ref=e109]: Το FP2 δεν έδειχνε καμία ανάσταση νεκρών. Ο Alonso ήταν 15ος με 1:39.478 και ο Stroll 18ος με 1:40.150. Στο Friday Debrief του F1 Stories, ο ιδανικός γύρος της Aston Martin, δηλαδή οι καλύτεροι τομείς της ενωμένοι σε έναν γύρο, έβγαινε 1:39.332, περίπου 1,879 δευτερόλεπτα πίσω από τον καλύτερο συνδυαστικό χρόνο της Ferrari. Το μοντέλο ρυθμού αγώνα την έβαζε μάλιστα μόλις δέκατη, με εκτίμηση 1:46.805. Πουθενά δεν υπήρχε κάποιο νούμερο που να φωνάζει ότι η Aston ετοιμαζόταν να γίνει η έκπληξη του midfield.
              - iframe [ref=e111]:
                - generic [ref=f2e1]:
                  - link "Μετάβαση στο περιεχόμενο" [ref=f2e2] [cursor=pointer]:
                    - /url: "#main"
                  - main [ref=f2e3]:
                    - generic [ref=f2e4]:
                      - tabpanel "Debrief" [ref=f2e5]:
                        - generic [ref=f2e7]:
                          - generic [ref=f2e8]:
                            - text: Ελεύθερες δοκιμές Παρασκευής ·
                            - generic [ref=f2e9]: "2026"
                          - heading "Debrief Παρασκευής" [level=2] [ref=f2e10]
                          - paragraph [ref=f2e11]: "Ανάλυση δεδομένων FP1/FP2: ταχύτητα σε έναν γύρο, ρυθμός σε μεγάλα stint και φθορά ελαστικών ανά Grand Prix, με βάση το FIA Friday Debrief."
                      - generic [ref=f2e12]:
                        - generic [ref=f2e13]: F1 Stories · Σεζόν 2026
                        - link "Άνοιγμα στο F1 Stories →" [ref=f2e14] [cursor=pointer]:
                          - /url: https://f1stories.gr/standings/?tab=debrief&focus=panel-debrief&debriefRound=16&debriefView=team-ideal
              - paragraph [ref=e112]: Γιατί ιδανικός γύρος και όχι απλώς ο πίνακας του FP2; Γιατί αν κοιτάξεις μόνο το 15ος και 18ος, εύκολα συμπεραίνεις ότι η Aston ήταν πάλι εκεί που ήταν πάντα. Ο ιδανικός γύρος αφαιρεί μέρος του θορύβου από έναν γύρο που δεν βγήκε τέλειος και δείχνει τι υπήρχε διαθέσιμο, αν ενώσεις τους καλύτερους τομείς. Ούτε αυτός ήταν εντυπωσιακός. Ήταν όμως αρκετά καλύτερος από ό,τι θα περίμενες από μια ομάδα καταδικασμένη στο Q1.
              - heading "Σάββατο" [level=3] [ref=e113]
              - paragraph [ref=e114]:
                - text: Το Σάββατο αυτή η δυνατότητα έγινε αποτέλεσμα. Ο Alonso έγραψε
                - link "1:37.220 στο Q2" [ref=e115] [cursor=pointer]:
                  - /url: https://www.formula1.com/en/results/2026/races/1308/bahrain/qualifying
                - text: ", ο Stroll 1:37.566, και για πρώτη φορά φέτος η Aston Martin πέρασε και τα δύο αυτοκίνητα από το Q1. Ο Alonso έμεινε περίπου 1,5 δευτερόλεπτο από τον καλύτερο χρόνο του Q2, και ο ίδιος σημείωσε ότι ήταν η μικρότερη απόσταση που είχε δει η ομάδα όλη τη χρονιά. Για μια ομάδα που επτά μέρες νωρίτερα ήταν 19η και 21η, δεν είναι μικρή αλλαγή."
              - paragraph [ref=e116]: Η ίδια κατατακτήρια, πάντως, έδειχνε ότι τα βασικά προβλήματα ήταν όλα στη θέση τους. Η Aston Martin έπιανε γύρω στα 305 km/h στις προσπάθειες και των δύο οδηγών, και ο Stroll υπολόγιζε ότι το αυτοκίνητο έχανε ακόμα πάνω από ένα δευτερόλεπτο στις ευθείες. Το πρόβλημα στην τελική ταχύτητα δεν είχε λυθεί. Ό,τι κέρδισε η ομάδα, το κέρδισε στα υπόλοιπα σημεία του γύρου, εκεί όπου η AMR26 μπορούσε να πάρει πίσω ένα μέρος από αυτό το δευτερόλεπτο.
              - paragraph [ref=e117]: "Με ποιον, όμως, να συγκρίνεις τον Alonso για να δεις πού βρέθηκε αυτός ο χρόνος; Με τον Verstappen όχι, γιατί μια διαφορά γύρω στα δύο δευτερόλεπτα θα μας έλεγε κυρίως ότι η Red Bull είναι πιο γρήγορη. Ο Liam Lawson είναι πολύ πιο χρήσιμο μέτρο: έγραψε 1:37.023 στο Q2, μόλις 0,197 μπροστά από τον Alonso, με αυτοκίνητο που βρίσκεται ακριβώς στη ζώνη όπου η Aston θέλει να παλέψει. Στο Ghost Car παρακάτω φαίνεται αν αυτή η μικρή διαφορά χτίστηκε σε ένα συγκεκριμένο κομμάτι της πίστας ή μοιράστηκε σε όλο τον γύρο."
              - iframe [ref=e119]
              - paragraph [ref=e120]: Εδώ αποκτά νόημα ο όρος track sensitivity. Δεν σημαίνει απλώς ότι ένα αυτοκίνητο «είναι καλό στις στροφές και κακό στις ευθείες». Σημαίνει ότι οι δυνάμεις και οι αδυναμίες του είναι τόσο άνισα μοιρασμένες, που η θέση του απέναντι στους αντιπάλους μπορεί να αλλάξει απότομα, ανάλογα με το τι ζητάει περισσότερο η κάθε πίστα.
              - paragraph [ref=e121]: Ένα αυτοκίνητο με μεγάλη έλλειψη ισχύος ή με πολύ drag θα πληρώσει δυσανάλογα σε Monza και Baku. Αν όμως το ίδιο αυτοκίνητο έχει αξιοπρεπή μηχανική ισορροπία, φέρεται σχετικά ήπια στα ελαστικά και κρατάει ταχύτητα σε διαδοχικές στροφές, μια πίστα σαν το Sepang αλλάζει το πόσο μετράει κάθε κομμάτι της εξίσωσης. Το αυτοκίνητο δεν φτιάχνεται. Απλώς ανεβαίνει η αξία όσων κάνει καλά και μικραίνει η ζημιά από όσα κάνει άσχημα. Γι' αυτό, για ένα τέτοιο αυτοκίνητο, το «είναι καλό ή κακό;» είναι λάθος ερώτηση. Η σωστή είναι «καλό πού;».
              - paragraph [ref=e122]: "Η σύγκριση με τον Carlos Sainz δείχνει το ίδιο από άλλη οπτική γωνία. Στο Q2 ο Alonso ήταν 0,307 πιο γρήγορος από τον οδηγό της Williams, παρότι η Aston συνέχιζε να υποφέρει στις ευθείες. Η τηλεμετρία δεν μπορεί να μας πει πόσο downforce έχει η Aston, μπορεί όμως να δείξει το αντάλλαγμα: πού χάνει η πράσινη γραμμή σε επιτάχυνση και τελική ταχύτητα, και πού τα παίρνει πίσω, στην ελάχιστη ταχύτητα ή στην έξοδο των στροφών."
              - iframe [ref=e124]
              - iframe [ref=e126]
              - paragraph [ref=e127]: Η σύγκριση με τη Williams έχει αξία και για έναν ακόμα λόγο, γιατί κόβει μια εύκολη δικαιολογία. Αν η Aston είχε απλώς ωφεληθεί από περίεργες συνθήκες, θα περίμενε κανείς ένα κάπως τυχαίο αποτέλεσμα. Στο Q2, όμως, ο Alonso βρέθηκε μπροστά από τον Sainz σε κανονική μονομαχία ενός γύρου. Η πίστα δεν έκανε την AMR26 γρήγορη παντού, της έδωσε όμως αρκετά σημεία για να μαζέψει χρόνο με τον δικό της τρόπο.
              - heading "Κυριακή" [level=3] [ref=e128]
              - paragraph [ref=e129]:
                - text: Η Κυριακή, αντί να ξεκαθαρίσει την εικόνα, τη μπέρδεψε παραπάνω. Η Aston Martin ξεκίνησε με
                - link "κατλα την άποψη μου λάθος απόφαση" [ref=e130] [cursor=pointer]:
                  - /url: https://www.astonmartinf1.com/en-GB/races/2026-bahrain-gp
                - text: ", βάζοντας και τους δύο οδηγούς σε Medium σε μια πίστα που ήταν ακόμα πολύ βρεγμένη. Ο Stroll αντέδρασε και πέρασε σε Intermediate, ενώ ο Alonso επέμεινε στα slicks. Το Safety Car του ένατου γύρου ξαναμοίρασε ουσιαστικά την τράπουλα, και από εκεί και πέρα τα δύο AMR26 πήγαν σε Hard. Ο Alonso έκανε δύο συνεχόμενα stint με αυτή τη γόμα, πέρασε τον Ocon και αργότερα τον Lindblad, έβαλε Soft για το τελευταίο κομμάτι και κράτησε πίσω του τον Norris μέχρι τη σημαία, για την όγδοη θέση."
              - iframe [ref=e132]
              - paragraph [ref=e133]: Κάποιος θα το έλεγε «τυχερό P8», και δεν θα είχε εντελώς άδικο. Ναι, ο Alonso κέρδισε θέσεις όταν ο Russell και ο Norris είχαν τα προβλήματά τους, και ναι, το Safety Car τον βοήθησε στρατηγικά. Χρειάστηκε όμως και αρκετή πραγματική ταχύτητα για να περάσει αυτοκίνητα μέσα στην πίστα και, στο τέλος, να μην αφήσει τον Norris να τον προσπεράσει. Για την Aston Martin, το P8 ήταν το καλύτερο αποτέλεσμα της χρονιάς και μόλις η δεύτερη φορά που μπήκε στους βαθμούς το 2026.
              - heading "Και τώρα;" [level=3] [ref=e134]
              - paragraph [ref=e135]:
                - text: Ότι η Aston γύρισε σελίδα, δεν το λένε ούτε οι ίδιοι οι οδηγοί της. Αντίθετα, ήταν οι πρώτοι που έριξαν νερό στο κρασί. Ο Alonso, όπως είπαμε,
                - link "το ξεκαθάρισε" [ref=e136] [cursor=pointer]:
                  - /url: https://www.formula1.com/en/latest/article/how-a-miracle-helped-alonso-and-aston-martin-to-earn-p12-on-the-grid-for-the-bahrain-grand-prix-in-malaysia.gtjGUTcnU67mvSadBmN9J
                - text: "ήδη μετά τις κατατακτήριες: το αυτοκίνητο ήταν το ίδιο με τους προηγούμενους αγώνες. Ο Stroll πήγε ακόμα πιο μακριά. Πιστεύει ότι υπάρχουν κάποιες πίστες, όπως η Μαλαισία και ίσως η Σιγκαπούρη, όπου η AMR26 μπορεί να περάσει το Q1 ακριβώς επειδή η μορφή της πίστας κρύβει τις αδυναμίες της. Μόλις επιστρέψουν οι μεγάλες απαιτήσεις στις ευθείες, περιμένει ξανά δυσκολίες."
              - paragraph [ref=e137]: Δεν είναι και το πιο κολακευτικό συμπέρασμα για ένα project που μπήκε στη νέα εποχή με τον Newey, τη Honda και πολύ μεγαλύτερες προσδοκίες. Τεχνικά, όμως, λέει πολύ περισσότερα από ένα απλό «η Aston βελτιώθηκε». Η AMR26 μοιάζει να έχει ένα πολύ στενό φάσμα πιστών όπου μπορεί να δείχνει αξιοπρεπής. Έξω από αυτό, οι αδυναμίες της γίνονται τόσο μεγάλες που τρώνε οτιδήποτε άλλο κάνει σωστά.
              - paragraph [ref=e138]: Αυτό αλλάζει και τον τρόπο που πρέπει να διαβάζουμε ό,τι ακολουθεί. Αν η Aston Martin περάσει ξανά στο Q2 ή πάρει βαθμούς στη Σιγκαπούρη, δεν σημαίνει αυτόματα ότι ξεκίνησε η ανάκαμψη. Αν γυρίσει στις τελευταίες θέσεις σε μια πίστα όπου μετράει περισσότερο η ισχύς, δεν σημαίνει απαραίτητα ότι «χάθηκε» η πρόοδος. Μπορεί απλώς να βλέπουμε το ίδιο ακριβώς αυτοκίνητο κάτω από άλλο φως.
              - paragraph [ref=e139]: Το Sepang δεν έκανε την AMR26 καλό αυτοκίνητο. Εδώ και αρκετούς αγώνες, όμως, αν ρωτούσες «καλή πού;», η τίμια απάντηση ήταν «πουθενά». Αυτή τη φορά ήταν διαφορετική. Δεν είναι και πολύ, για τη φετινή Aston Martin όμως είναι κάτι.
