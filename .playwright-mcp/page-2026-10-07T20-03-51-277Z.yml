            - generic [ref=e95]:
              - paragraph [ref=e96]:
                - text: Μία εβδομάδα πριν από το Sepang, στο Baku, η Aston Martin δεν είχε πολλά να θυμάται με χαρά. Ο Fernando Alonso και ο Lance Stroll ήταν
                - link "19ος και 21ος" [ref=e97] [cursor=pointer]:
                  - /url: https://www.formula1.com/en/results/2026/races/1295/azerbaijan/qualifying
                - text: "στις κατατακτήριες, και την επόμενη μέρα κανένας από τους δύο δεν είδε την καρό σημαία. Επτά μέρες μετά, στη Μαλαισία, πέρασαν και οι δύο στο Q2, πήραν τις καλύτερες θέσεις εκκίνησης της ομάδας φέτος, και την Κυριακή ο Alonso τερμάτισε όγδοος. Η πρώτη σκέψη είναι ότι κάτι βρήκαν επιτέλους στο αυτοκίνητο. Ο ίδιος ο Alonso, όμως, σου τη χαλάει: η AMR26, είπε, ήταν στην ουσία η ίδια."
              - paragraph [ref=e98]: Όταν ένα αυτοκίνητο πηγαίνει μέσα σε επτά μέρες από το τέλος του grid στη μέση του midfield, χωρίς καμία αναβάθμιση που να το δικαιολογεί, μάλλον δεν άλλαξε τόσο το ίδιο. Άλλαξε η ερώτηση που του έκανε η πίστα. Και το Baku με το Sepang κάνουν δύο πολύ διαφορετικές ερωτήσεις.
              - paragraph [ref=e99]: "Στο Baku η ερώτηση είναι μία και επαναλαμβάνεται σε όλο τον γύρο: πόσο καλά επιταχύνεις και πόση ταχύτητα κρατάς σε μια ευθεία που δεν λέει να τελειώσει; Η AMR26 απάντησε λάθος. Ο Alonso έγραψε 1:46.593 στο Q1, σχεδόν τρία δευτερόλεπτα πιο αργά από το 1:43.615 του George Russell, και ο Stroll ήταν ακόμα πιο πίσω, με 1:47.337. Αποκλεισμός και για τους δύο, με την πρώτη."
              - paragraph [ref=e100]:
                - text: "Το Sepang, μην παρεξηγηθούμε, έχει κι αυτό τις ευθείες του: δύο πολύ μεγάλες, δυνατά φρεναρίσματα και τέσσερις ζώνες Straight Mode. Έχει όμως και κάτι που στο Baku υπάρχει σε πολύ μικρότερη δόση, μεγάλες σειρές στροφών όπου η ισορροπία του σασί, η αλλαγή κατεύθυνσης και η ταχύτητα που κρατάς μέσα στη στροφή μετράνε πραγματικά στον χρόνο του γύρου."
                - link "Οι στροφές 5 και 6" [ref=e101] [cursor=pointer]:
                  - /url: https://www.formula1.com/en/latest/article/need-to-know-the-most-important-facts-stats-and-trivia-ahead-of-the-2026-bahrain-grand-prix-in-malaysia.7q5fTKLLQ5TrEcsNerl406
                - text: είναι από τα πιο γρήγορα σημεία αλλαγής κατεύθυνσης της πίστας, και ο μεσαίος τομέας ζητάει από ένα αυτοκίνητο πολύ περισσότερα από ωμή επιτάχυνση. Κάπου εκεί αρχίζει να εξηγείται το παράδοξο.
              - paragraph [ref=e102]:
                - text: Αν δεις και τι ζητάει η πίστα από τα ελαστικά, η εικόνα ολοκληρώνεται. Το Tyre Intelligence, που βασίζεται στο επίσημο υλικό της Pirelli, δίνει στο Sepang 4/5 σε πλευρικά φορτία, φρενάρισμα, καταπόνηση ελαστικών και τραχύτητα ασφάλτου, αλλά μόλις 2/5 στην πρόσφυση της ασφάλτου. Η Pirelli είχε επίσης
                - link "προειδοποιήσει" [ref=e103] [cursor=pointer]:
                  - /url: https://www.formula1.com/en/latest/article/what-tyres-will-the-teams-and-drivers-have-for-the-2026-bahrain-grand-prix-in-malaysia.4vcrMxYY9DWg7PwyiNMrEV
                - text: "ότι την Παρασκευή το grip θα ήταν χαμηλό και θα ανέβαινε αισθητά όσο η επιφάνεια μάζευε λάστιχο. Χαμηλό αρχικό grip, μαζί με μεγάλες απαιτήσεις σε πλευρικά φορτία, φρενάρισμα και καταπόνηση ελαστικών: το Sepang δεν είναι πίστα ενός μόνο χαρακτηριστικού."
              - iframe [ref=e105]:
